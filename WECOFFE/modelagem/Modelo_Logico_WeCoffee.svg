<title id="title">We Coffee: modelo lógico relacional da Entrega 2</title>
<desc id="desc">Dez tabelas, quarenta e quatro colunas e nove chaves estrangeiras. Tipos, PKs e FKs aparecem em cada linha. Cardinalidades mínimas de pedido, cupom e recebimento dependem das rotinas transacionais e das auditorias documentadas.</desc>
