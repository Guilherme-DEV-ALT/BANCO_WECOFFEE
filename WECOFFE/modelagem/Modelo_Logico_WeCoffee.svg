<text x="1870" y="2200" text-anchor="middle" font-size="25">As tabelas PEDIDO_PRODUTO e ENTRADA_PRODUTO implementam os relacionamentos N:M do DER.</text>
<text x="1870" y="2245" text-anchor="middle" font-size="23">NOT NULL, UNIQUE, CHECK, DEFAULT e restrições entre linhas constam do dicionário e do script. valor_total é calculado em view.</text>
<text x="1870" y="2290" text-anchor="middle" font-size="22">Notação visual do brModelo. Arquivo nativo editável disponível. Cardinalidade mínima exige criação transacional completa e auditoria.</text>
