<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2640" viewBox="0 0 1900 2640" role="img" aria-labelledby="title desc">
<title id="title">Fluxograma da We Coffee: vendas, pagamentos e recebimentos</title>
<desc id="desc">Recebimentos somam unidades. Quitação baixa estoque uma vez. Cancelamento antes do preparo devolve unidades; depois, apenas retorno físico confirmado. Estorno financeiro é independente. Proposta a validar com a unidade.</desc>
